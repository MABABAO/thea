<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/journal.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#journal">Skip to journal</a>
  <div class="page">
    <header class="masthead">
      <span class="ornament" aria-hidden="true">✧</span>
      <a class="site-title" href="{{ '/' | relative_url }}">The Diary of<br><span>Thea Lightbearer</span></a>
      <p class="subtitle">Memory · Discovery · The road ahead</p>
      <div class="rule" aria-hidden="true">❧</div>
    </header>
    <main id="journal" tabindex="-1">{{ content }}</main>
    <footer class="footer"><span aria-hidden="true">✧</span><p>The Diary of Thea Lightbearer</p></footer>
  </div>
</body>
</html>
